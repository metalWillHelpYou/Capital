server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # index.html не должен кэшироваться браузером/CDN — иначе после нового
    # деплоя люди продолжают получать старую версию приложения, пока сами
    # не сделают hard refresh. Файлы в /assets/ у Vite именуются с хэшем
    # содержимого (например app.a1b2c3.js), поэтому их, наоборот, можно
    # кэшировать надолго: при изменении кода поменяется и имя файла.
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # На случай, если позже добавите client-side роутинг —
    # неизвестные пути отдают index.html, а не 404.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
